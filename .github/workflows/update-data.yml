name: Update HackerRank Data
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ hackerrank ]  # Changed from main
    paths:
      - '.github/workflows/update-data.yml'
      - 'fetch_hackerrank_data.py'
permissions:
  contents: write
jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml
      
      - name: Fetch HackerRank data
        run: |
          python fetch_hackerrank_data.py ${{ secrets.HACKERRANK_USERNAME }}
      
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Pull latest changes first to avoid conflicts
          git pull --rebase origin hackerrank  # Changed from main
          
          # Add and commit if there are changes
          git add hackerrank_data.json
          
          # Only commit and push if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Update HackerRank data - $(date +'%Y-%m-%d %H:%M:%S')"
            git push origin hackerrank  # Changed from main
          fi
