name: Update HackerRank Data

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [hackerrank]
    paths:
      - ".github/workflows/update-data.yml"
      - "fetch_hackerrank_data.py"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Fetch HackerRank data
        run: |
          python fetch_hackerrank_data.py ${{ secrets.HACKERRANK_USERNAME }}

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Add the file first
          git add hackerrank_data.json

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Pull with autostash to handle any remote changes
          git pull --rebase --autostash origin hackerrank

          # Commit the changes
          git commit -m "🤖 Update HackerRank data - $(date +'%Y-%m-%d %H:%M:%S')"

          # Push to remote
          git push origin hackerrank
